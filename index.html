<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat (Tanpa Login)</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
        }
        .header {
            width: 100%;
            background-color: #181825;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #313244;
        }
        .header h1 {
            font-size: 18px;
            color: #89b4fa;
        }
        select {
            background-color: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }
        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap; /* Menjaga format enter/baris baru */
        }
        .user {
            background-color: #89b4fa;
            color: #11111b;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai {
            background-color: #313244;
            color: #cdd6f4;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .error {
            background-color: #f38ba8;
            color: #11111b;
            align-self: center;
            font-size: 14px;
            text-align: center;
        }
        .input-area {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background-color: #181825;
            display: flex;
            gap: 10px;
            border-top: 1px solid #313244;
        }
        textarea {
            flex: 1;
            background-color: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            border-radius: 8px;
            padding: 12px;
            resize: none;
            height: 50px;
            outline: none;
            font-size: 15px;
        }
        textarea:focus {
            border-color: #89b4fa;
        }
        button {
            min-width: 76px;
            height: 46px;
            padding: 0 16px;
            border: 1px solid rgba(137, 180, 250, 0.25);
            border-radius: 12px;
            background: #89b4fa;
            color: #11111b;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: background-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
            white-space: nowrap;
        }
        button:hover {
            background: #b4befe;
            box-shadow: 0 4px 12px rgba(137, 180, 250, 0.18);
        }
        button:active {
            transform: scale(0.97);
        }
        button:focus-visible {
            outline: 2px solid #b4befe;
            outline-offset: 3px;
        }
        button:disabled {
            background: #585b70;
            border-color: transparent;
            color: #a6adc8;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Animasi loading titik-titik */
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤖 DeepSeek AI</h1>
        <select id="model-select">
            <option value="deepseek-chat">DeepSeek Chat (V3)</option>
            <option value="deepseek-reasoner">DeepSeek Reasoner (R1)</option>
        </select>
    </div>

    <div id="chat-container">
        <div class="message ai">Halo! Saya DeepSeek. Ada yang bisa saya bantu hari ini?</div>
    </div>

    <div class="input-area">
        <textarea id="user-input" placeholder="Ketik pesan kamu di sini... (Tekan Enter untuk kirim)"></textarea>
        <button id="send-btn" onclick="kirimPesan()">Kirim</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');

        // Simpan riwayat agar pertanyaan lanjutan tetap memiliki konteks.
        const riwayatChat = [
            {
                role: 'system',
                content: 'Kamu adalah asisten AI yang membantu, jelas, ramah, dan menjawab dalam bahasa yang digunakan pengguna. Pahami konteks percakapan sebelumnya.'
            }
        ];

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                kirimPesan();
            }
        });

        async function kirimPesan() {
            const pesan = userInput.value.trim();
            if (!pesan || sendBtn.disabled) return;

            tambahPesan(pesan, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            userInput.disabled = true;

            const loadingId = tambahPesan('Sedang berpikir', 'ai loading-dots');
            riwayatChat.push({ role: 'user', content: pesan });

            try {
                // Batasi riwayat agar percakapan panjang tidak terus membesar.
                const pesanUntukAI = [
                    riwayatChat[0],
                    ...riwayatChat.slice(-20)
                ];

                const response = await puter.ai.chat(pesanUntukAI, {
                    model: modelSelect.value,
                    normalize: true
                });

                const isi = response?.message?.content ?? response?.content ?? response;
                let jawabanAI = '';

                if (typeof isi === 'string') {
                    jawabanAI = isi.trim();
                } else if (Array.isArray(isi)) {
                    jawabanAI = isi
                        .filter(item => item && (item.type === 'text' || typeof item.text === 'string'))
                        .map(item => item.text || '')
                        .join('\n')
                        .trim();
                }

                if (!jawabanAI) {
                    throw new Error('AI tidak mengirimkan jawaban teks. Coba kirim pertanyaan lagi.');
                }

                hapusPesan(loadingId);
                tambahPesan(jawabanAI, 'ai');
                riwayatChat.push({ role: 'assistant', content: jawabanAI });
            } catch (error) {
                console.error('Kesalahan chat:', error);
                hapusPesan(loadingId);
                riwayatChat.pop();
                const detail = error?.message || 'Terjadi kesalahan yang tidak diketahui.';
                tambahPesan('Maaf, jawaban gagal dimuat. ' + detail + ' Periksa koneksi internet lalu coba lagi.', 'ai error');
            } finally {
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        function tambahPesan(teks, tipe) {
            const div = document.createElement('div');
            div.className = 'message ' + tipe;
            div.textContent = teks;
            const id = 'msg-' + Date.now() + Math.random().toString(36).slice(2, 11);
            div.id = id;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function hapusPesan(id) {
            const elemen = document.getElementById(id);
            if (elemen) elemen.remove();
        }
    </script>
</body>
</html>
