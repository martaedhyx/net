<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Chat (Tanpa Login)</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
        }
        .header {
            width: 100%;
            background-color: #181825;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #313244;
        }
        .header h1 {
            font-size: 18px;
            color: #89b4fa;
        }
        select {
            background-color: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }
        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap; /* Menjaga format enter/baris baru */
        }
        .user {
            background-color: #89b4fa;
            color: #11111b;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai {
            background-color: #313244;
            color: #cdd6f4;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .error {
            background-color: #f38ba8;
            color: #11111b;
            align-self: center;
            font-size: 14px;
            text-align: center;
        }
        .input-area {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background-color: #181825;
            display: flex;
            gap: 10px;
            border-top: 1px solid #313244;
        }
        textarea {
            flex: 1;
            background-color: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            border-radius: 8px;
            padding: 12px;
            resize: none;
            height: 50px;
            outline: none;
            font-size: 15px;
        }
        textarea:focus {
            border-color: #89b4fa;
        }
        button {
            background-color: #89b4fa;
            color: #11111b;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 15px;
        }
        button:hover {
            background-color: #b4befe;
        }
        button:disabled {
            background-color: #585b70;
            color: #a6adc8;
            cursor: not-allowed;
        }
        
        /* Animasi loading titik-titik */
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🤖 DeepSeek AI</h1>
        <select id="model-select">
            <option value="deepseek-chat">DeepSeek Chat (V3)</option>
            <option value="deepseek-reasoner">DeepSeek Reasoner (R1)</option>
        </select>
    </div>

    <div id="chat-container">
        <div class="message ai">Halo! Saya DeepSeek. Ada yang bisa saya bantu hari ini?</div>
    </div>

    <div class="input-area">
        <textarea id="user-input" placeholder="Ketik pesan kamu di sini... (Tekan Enter untuk kirim)"></textarea>
        <button id="send-btn" onclick="kirimPesan()">Kirim</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');

        // Fitur: Tekan Enter untuk kirim, Shift+Enter untuk baris baru
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                kirimPesan();
            }
        });

        async function kirimPesan() {
            const pesan = userInput.value.trim();
            if (!pesan) return;

            // 1. Tampilkan pesan user di layar
            tambahPesan(pesan, 'user');
            userInput.value = '';
            
            // 2. Nonaktifkan tombol & input sementara
            sendBtn.disabled = true;
            userInput.disabled = true;

            // 3. Tampilkan indikator loading
            const loadingId = tambahPesan('Sedang berpikir', 'ai loading-dots');

            try {
                const modelTerpilih = modelSelect.value;
                
                // 4. Panggil API Puter.js
                const response = await puter.ai.chat(pesan, { 
                    model: modelTerpilih 
                });

                // 5. Hapus loading dan tampilkan jawaban
                hapusPesan(loadingId);
                
                // Mengecek struktur response dari Puter.js
                const jawabanAI = response.message ? response.message.content : response;
                tambahPesan(jawabanAI, 'ai');

            } catch (error) {
                console.error(error);
                hapusPesan(loadingId);
                tambahPesan("Gagal mengambil jawaban. Pastikan koneksi internet lancar atau coba lagi nanti.", 'ai error');
            } finally {
                // 6. Kembalikan fungsi tombol & input
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        function tambahPesan(teks, tipe) {
            const div = document.createElement('div');
            div.className = `message ${tipe}`;
            div.textContent = teks;
            
            // Buat ID unik untuk pesan (untuk loading)
            const id = 'msg-' + Date.now() + Math.random().toString(36).substr(2, 9);
            div.id = id;
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Auto scroll ke bawah
            return id;
        }

        function hapusPesan(id) {
            const elemen = document.getElementById(id);
            if (elemen) elemen.remove();
        }
    </script>
</body>
</html>
